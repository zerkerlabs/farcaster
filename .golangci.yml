# golangci-lint v2 configuration for Zerker Gateway.
# Docs: https://golangci-lint.run/usage/configuration/
version: "2"

linters:
  default: standard
  enable:
    - bodyclose      # HTTP response bodies must be closed
    - errcheck       # unchecked errors are bugs waiting to happen
    - errorlint      # correct error wrapping / comparison
    - gocritic       # opinionated correctness + style checks
    - gosec          # security-focused static analysis (important for a gateway)
    - misspell
    - revive         # broad style/lint rules
    - unconvert
    - unparam
    - whitespace
  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck

formatters:
  enable:
    - gofumpt
