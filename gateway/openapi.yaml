openapi: 3.0.3
info:
  title: Zerker Gateway API
  version: "1.0.0"
  description: >-
    The Zerker gateway's `/v1` REST surface: the Agent Catalog, credential
    vault, transactional/streaming proxy, invocation and analytics
    observability, settlement configuration, and per-tenant policy authoring.
    This document describes
    **existing, implemented behavior** — it is generated by hand from
    `gateway/internal/httpapi/` and is the canonical contract the product
    website's API reference renders from (spec 0008, Resolved Decision 3). Any
    change to a handler's request/response shape must update this file in the
    same PR (spec 0008 T7 wires a CI drift-guard over this pairing).

    Two operational routes (`/healthz`, `/version`) sit outside `/v1` and
    require no authentication (AGENTS.md invariant #1).
  contact:
    name: Zerker
    url: https://github.com/zerkerlabs/gateway
externalDocs:
  description: docs/specs/ (product specs 0001-0006 this surface implements)
  url: https://github.com/zerkerlabs/gateway/tree/main/docs/specs
servers:
  - url: /
    description: The gateway serves this contract at its own root; no fixed host is baked in (self-hostable).
tags:
  - name: Operational
    description: Unauthenticated health/build-metadata routes (AGENTS.md invariant #9).
  - name: Agents
    description: Agent Catalog CRUD — spec 0001, spec 0002.
  - name: Credentials
    description: Upstream credential vault — spec 0002. Secrets never leave the server (invariant #4).
  - name: Proxy
    description: Transactional and streaming invocation forwarding, plus polling — spec 0002, spec 0004 (MCP), spec 0005 (x402 gate), spec 0006 (settlement).
  - name: Invocations
    description: Durable invocation records — spec 0003.
  - name: Analytics
    description: Aggregate observability metrics — spec 0003.
  - name: Settlement
    description: Per-tenant facilitator configuration for settle-then-forward — spec 0006.
  - name: Policy
    description: Per-tenant policy authoring (allow/warn/deny over agents and MCP tools) — spec 0009.
security:
  - oidcBearer: []
paths:
  /healthz:
    get:
      tags: [Operational]
      operationId: getHealthz
      summary: Liveness/readiness probe
      description: >-
        Returns subsystem health only (invariant #9) — no internal addresses,
        dependency trees, or config values. Exempt from authentication
        (invariant #1).
      security: []
      responses:
        "200":
          description: The gateway is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthzResponse"
  /version:
    get:
      tags: [Operational]
      operationId: getVersion
      summary: Build metadata
      description: >-
        Returns deliberate build metadata only (invariant #9) — version and
        commit, ldflags-injected at build time. Exempt from authentication
        (invariant #1).
      security: []
      responses:
        "200":
          description: Build metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /v1/agents:
    post:
      tags: [Agents]
      operationId: createAgent
      summary: Register a new agent
      description: >-
        Creates an agent scoped to the caller's tenant. Status is derived:
        `pending` when `upstream_url` is absent, `active` once one is set
        (spec 0002). `protocol` defaults to `http`; `protocol=mcp` requires
        `mcp_transport` to be `streamable_http` (spec 0004 Decision 2/3).
        `pricing`, when present, enables the x402 payment gate on this agent
        (spec 0005) and requires `pricing.network=base`, `pricing.asset=USDC`;
        per-tool overrides in `pricing.tools` require `protocol=mcp`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentCreateRequest"
      responses:
        "201":
          description: Agent created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          description: Invalid body, missing name, invalid `upstream_url`/protocol/pricing combination.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: An active or pending agent with this name already exists in the tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Agents]
      operationId: listAgents
      summary: List agents
      description: Paginated, tenant-scoped list of agents, optionally filtered by protocol.
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 50, minimum: 1 }
        - name: protocol
          in: query
          description: Filter by protocol. Omit for all protocols.
          schema: { type: string, enum: [http, mcp] }
      responses:
        "200":
          description: A page of agents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentListResponse"
        "400":
          description: "`protocol` is not `http` or `mcp`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/agents/{id}:
    parameters:
      - $ref: "#/components/parameters/AgentID"
    get:
      tags: [Agents]
      operationId: getAgent
      summary: Get an agent
      responses:
        "200":
          description: The agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Agents]
      operationId: updateAgent
      summary: Update an agent
      description: >-
        Partial update. Only client-settable fields are accepted; `id`,
        `status`, `created_by`, and timestamps are immutable. Several fields
        are tri-state (absent key = leave unchanged, `null` = clear, a value =
        set) — see each field's description.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentUpdateRequest"
      responses:
        "200":
          description: The updated agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          description: Invalid body or an invalid resulting protocol/mcp/pricing combination.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The new name conflicts with another active or pending agent in the tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Agents]
      operationId: deleteAgent
      summary: Soft-delete an agent
      description: Sets the agent's status to `inactive`. The record is preserved for audit; it is no longer invocable.
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/credentials:
    post:
      tags: [Credentials]
      operationId: createCredential
      summary: Store a new upstream credential
      description: >-
        `plaintext` (source=managed) is envelope-encrypted before any
        persistence and never appears in any response (invariant #4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialCreateRequest"
      responses:
        "201":
          description: Credential created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          description: Invalid body, missing name/auth_type, or a source/plaintext/vault_ref mismatch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A credential with this name already exists in the tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Credentials]
      operationId: listCredentials
      summary: List credentials
      description: Tenant-scoped. Only metadata and the masked hint are returned — never secret material (invariant #4).
      responses:
        "200":
          description: All credentials for the tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/credentials/{id}:
    parameters:
      - $ref: "#/components/parameters/CredentialID"
    get:
      tags: [Credentials]
      operationId: getCredential
      summary: Get a credential
      responses:
        "200":
          description: The credential (metadata only).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Credentials]
      operationId: putCredential
      summary: Update or rotate a credential
      description: >-
        All fields optional; an absent key leaves it unchanged. A present but
        empty `plaintext` is rejected (400) — it would otherwise overwrite the
        secret with the encryption of zero bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialPutRequest"
      responses:
        "200":
          description: The updated credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          description: Invalid body, empty name/plaintext, or invalid auth_type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The new name conflicts with another credential in the tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Credentials]
      operationId: deleteCredential
      summary: Delete a credential
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The credential is still referenced by one or more agents (`credential_ref` or `facilitator_credential_ref`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/proxy/{id}:
    parameters:
      - $ref: "#/components/parameters/AgentID"
    post:
      tags: [Proxy]
      operationId: transactInvocation
      summary: Invoke an agent transactionally
      description: >-
        Creates a durable invocation record and returns `202 Accepted`
        immediately with `invocation_id`; the upstream call runs server-side
        and the caller polls `GET /v1/proxy/{id}/invocations/{inv_id}` for the
        result (spec 0002). The request body is forwarded verbatim to the
        agent's `upstream_url`, capped at 32 MiB.


        For a priced agent (`pricing` set on the agent, spec 0005): a request
        with no `X-PAYMENT` header receives `402` with an x402 payment-required
        challenge instead of being forwarded, and no invocation is created; a
        request with an `X-PAYMENT` header has the payment authorization
        verified before forwarding, and — when the tenant has settlement
        configured (spec 0006) — settled via the facilitator before the
        upstream is ever called.
      parameters:
        - name: X-PAYMENT
          in: header
          description: Base64-encoded x402 payment payload (spec 0005), required only for priced agents.
          required: false
          schema: { type: string }
        - name: X-Zerker-Model
          in: header
          description: Caller-supplied model identifier recorded on the invocation (spec 0003). Max 256 bytes.
          required: false
          schema: { type: string, maxLength: 256 }
      requestBody:
        required: false
        description: Forwarded verbatim to the agent's upstream URL. For `protocol=mcp` agents this is a single JSON-RPC 2.0 request.
        content:
          "*/*":
            schema: {}
      responses:
        "202":
          description: Invocation accepted; the upstream call is running asynchronously.
          headers:
            X-Zerker-Invocation-ID:
              description: The invocation ID, also present in the body.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvocationAcceptedResponse"
        "400":
          description: "`X-Zerker-Model` exceeds 256 bytes."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: >-
            No `X-PAYMENT` header on a priced agent (body is an x402 payment
            challenge), or the supplied payment failed verification/settlement
            (body is a coarse `Error`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/X402Challenge"
                  - $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: Request body exceeds the 32 MiB cap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The agent is inactive, suspended, or has no `upstream_url` configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: The agent's per-agent invocation rate limit was exceeded (spec 0002).
          headers:
            Retry-After:
              description: Seconds until the next token is available (capped at 60).
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/proxy/{id}/stream:
    parameters:
      - $ref: "#/components/parameters/AgentID"
    post:
      tags: [Proxy]
      operationId: streamInvocation
      summary: Invoke an agent with a streamed request/response
      description: >-
        Opens a long-lived connection to the agent's upstream and streams the
        request and response bodies verbatim, without buffering (spec 0002).
        `X-Zerker-Invocation-ID` is set on the response before any upstream
        byte is written, regardless of outcome. On a settlement-enabled priced
        route (spec 0006), settlement completes before the upstream stream
        opens, and a successful settle's receipt rides the
        `X-PAYMENT-RESPONSE` response header.
      parameters:
        - name: X-PAYMENT
          in: header
          description: Base64-encoded x402 payment payload (spec 0005), required only for priced agents.
          required: false
          schema: { type: string }
        - name: X-Zerker-Model
          in: header
          description: Caller-supplied model identifier recorded on the invocation (spec 0003). Max 256 bytes.
          required: false
          schema: { type: string, maxLength: 256 }
      requestBody:
        required: false
        description: Streamed verbatim to the agent's upstream URL, unbounded (no 32 MiB cap on this path).
        content:
          "*/*":
            schema: {}
      responses:
        "200":
          description: The upstream's response, streamed back verbatim (status, headers, and body are the upstream's own — this describes the success shape, not a fixed status code).
          headers:
            X-Zerker-Invocation-ID:
              description: The invocation ID.
              schema: { type: string }
            X-PAYMENT-RESPONSE:
              description: Present only after a successful settle-then-forward; the facilitator's settlement receipt.
              schema: { type: string }
          content:
            "*/*":
              schema: {}
        "400":
          description: "`X-Zerker-Model` exceeds 256 bytes."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: >-
            No `X-PAYMENT` header on a priced agent (body is an x402 payment
            challenge), or the supplied payment failed verification/settlement
            (body is a coarse `Error`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/X402Challenge"
                  - $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: The agent is inactive, suspended, or has no `upstream_url` configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: The agent's per-agent invocation rate limit was exceeded (spec 0002).
          headers:
            Retry-After:
              description: Seconds until the next token is available (capped at 60).
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The upstream was unreachable or refused the connection.
          headers:
            X-Zerker-Invocation-ID:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: The upstream call timed out.
          headers:
            X-Zerker-Invocation-ID:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/proxy/{id}/invocations/{inv_id}:
    get:
      tags: [Proxy]
      operationId: pollInvocation
      summary: Poll a transactional invocation's status/result
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - name: inv_id
          in: path
          required: true
          schema: { type: string }
          description: The `inv_<uuidv7>` invocation ID returned by `POST /v1/proxy/{id}`.
      responses:
        "200":
          description: The invocation's current status and, once complete, its captured response body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvocationPollResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Not found, or the invocation does not belong to the agent in the path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/invocations:
    get:
      tags: [Invocations]
      operationId: listInvocations
      summary: List invocations
      description: Paginated (offset-based), tenant-scoped, filterable invocation history. Bodies are never returned on this endpoint (spec 0003).
      parameters:
        - name: agent_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [pending, running, succeeded, failed] }
        - name: mode
          in: query
          schema: { type: string, enum: [transactional, streaming] }
        - name: error_class
          in: query
          description: Passed through without validation; an unrecognized value simply returns no results.
          schema: { type: string }
        - name: model
          in: query
          schema: { type: string }
        - name: settlement
          in: query
          schema: { type: string, enum: [pending, settled, settlement_failed, settled_upstream_failed] }
        - name: since
          in: query
          description: RFC 3339 timestamp; inclusive lower bound on `created_at`.
          schema: { type: string, format: date-time }
        - name: until
          in: query
          description: RFC 3339 timestamp; inclusive upper bound on `created_at`.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100, minimum: 1 }
        - name: offset
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        "200":
          description: A page of invocations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvocationListResponse"
        "400":
          description: An invalid `status`, `mode`, `settlement`, `since`, or `until` value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/invocations/{id}:
    get:
      tags: [Invocations]
      operationId: getInvocation
      summary: Get an invocation
      description: >-
        Full invocation metadata for the caller's tenant. `req_body`/`resp_body`
        are included only when body capture was on for the row **and** the
        caller's token carries the `invocations:read_body` OAuth scope (spec
        0003 §4/§5); otherwise the fields are omitted while `body_captured`
        still reflects whether capture was on.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: The `inv_<uuidv7>` invocation ID.
      responses:
        "200":
          description: The invocation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvocationDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/analytics:
    get:
      tags: [Analytics]
      operationId: getAnalytics
      summary: Aggregate invocation metrics
      description: >-
        Aggregates the tenant's invocations by `agent_id` and a time bucket
        (spec 0003). Carries its own tighter per-caller rate limit than the
        global limiter, since percentile aggregation is heavier than a row
        fetch.
      parameters:
        - name: group_by
          in: query
          description: Only `agent_id` is supported in v1; an explicit other value is rejected.
          schema: { type: string, enum: [agent_id] }
        - name: bucket
          in: query
          schema: { type: string, enum: [hour, day], default: hour }
        - name: since
          in: query
          required: true
          description: RFC 3339 timestamp; required.
          schema: { type: string, format: date-time }
        - name: until
          in: query
          description: RFC 3339 timestamp; defaults to now. The `[since, until]` window is capped at 31 days.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Aggregated metrics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsResponse"
        "400":
          description: Missing/invalid `since`/`until`, an unsupported `group_by`/`bucket`, `since` after `until`, or a range exceeding 31 days.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: The endpoint's tighter per-caller rate limit was exceeded.
          headers:
            Retry-After:
              description: Seconds until the next token is available (capped at 60).
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/settlement/config:
    get:
      tags: [Settlement]
      operationId: getSettlementConfig
      summary: Get the tenant's settlement configuration
      responses:
        "200":
          description: The tenant's settlement configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: The tenant has not configured settlement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Settlement]
      operationId: patchSettlementConfig
      summary: Configure or update the tenant's settlement facilitator
      description: >-
        Both fields are optional on the wire; an absent field leaves its
        current value unchanged. The first configure call for a tenant must
        supply both (spec 0006 Decision 1). `facilitator_credential_ref` must
        resolve to a credential owned by the same tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettlementConfigRequest"
      responses:
        "200":
          description: The updated settlement configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementConfigResponse"
        "400":
          description: Empty field value, an invalid `facilitator_url`, an unresolvable `facilitator_credential_ref`, or an incomplete first configure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/policy:
    get:
      tags: [Policy]
      operationId: getPolicy
      summary: Get the tenant's policy document
      description: >-
        Returns the calling tenant's current policy document. A tenant with
        no policy configured gets the empty/absent default (`version: 0`, no
        `default`/`on_error`, empty `rules`, no `updated_at`) rather than a
        404 — no policy means zero behavior change (spec 0009).
      responses:
        "200":
          description: The tenant's policy document (or its empty default).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Policy]
      operationId: putPolicy
      summary: Replace the tenant's policy document
      description: >-
        A wholesale replace, not a partial patch: every call sets `default`,
        `on_error`, and `rules` to exactly what is given, including replacing
        `rules` with an empty list. The document is validated before it
        replaces the stored policy; a malformed document is rejected with
        `400` and never reaches the store (spec 0009).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyDocument"
      responses:
        "200":
          description: The replaced document's new version and timestamp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PutPolicyResponse"
        "400":
          description: Malformed request body — unknown action, ill-formed match condition, or missing `default`/`on_error`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/policy/decisions:
    get:
      tags: [Policy]
      operationId: listPolicyDecisions
      summary: Read the tenant's recent policy decisions
      description: >-
        Returns the calling tenant's most-recent policy decisions (allow, warn,
        and deny), newest first — the audit-capture read side (spec 0009).
        Each row carries the action, the matched rule position, the coarse
        reason, and the agent/tool it applied to; a request body is never
        recorded (invariant #3). Tenant-scoped: a tenant only ever sees its own
        decisions.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
          description: Maximum decisions to return, newest first. Clamped to [1, 100]; defaults to 20.
      responses:
        "200":
          description: The tenant's recent policy decisions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDecisionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        An OIDC-issued bearer JWT, validated against the gateway's configured
        issuer/audience (`ZERKER_OIDC_ISSUER`/`ZERKER_OIDC_AUDIENCE`).
        The token's tenant and user claims (configurable claim names) become
        the caller's identity; every `/v1` route requires both to be present.
        Missing or invalid tokens return `401` with no body. Some routes also
        check a scope claim (e.g. `invocations:read_body` on
        `GET /v1/invocations/{id}`). `/healthz` and `/version` are exempt.

  parameters:
    AgentID:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: The `agt_<uuidv7>` agent ID.
    CredentialID:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: The `cred_<uuidv7>` credential ID.

  responses:
    Unauthorized:
      description: Missing or invalid bearer token, or the token's tenant/user claims are absent. No body.
    NotFound:
      description: No resource with this ID exists in the caller's tenant.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: An unexpected server-side error. No body (internal detail is never returned to callers, invariant #3).

  schemas:
    Error:
      type: object
      description: The uniform error body for all 4xx responses that carry one.
      required: [error]
      properties:
        error:
          type: string
          description: A coarse, caller-safe message. Never contains internal state (invariant #3).

    HealthzResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, example: ok }

    VersionResponse:
      type: object
      required: [version, commit]
      properties:
        version: { type: string, description: ldflags-injected build version. }
        commit: { type: string, description: ldflags-injected short commit SHA. }

    Pricing:
      type: object
      description: >-
        x402 metering configuration for an agent (spec 0005). v1 accepts only
        USDC on Base. Absent/null on the parent object means the agent is
        unpriced.
      required: [amount, asset, network, pay_to]
      properties:
        amount:
          type: string
          description: Flat per-call price, smallest-unit decimal string.
          pattern: '^[0-9]+$'
        asset:
          type: string
          description: v1 accepts only "USDC".
          enum: [USDC]
        network:
          type: string
          description: v1 accepts only "base".
          enum: [base]
        pay_to:
          type: string
          description: Operator payout address (the gateway holds no key).
          pattern: '^0x[0-9a-fA-F]{40}$'
        tools:
          type: object
          description: >-
            Optional per-MCP-tool price overrides, keyed by tool name.
            Requires the agent's protocol to be `mcp`.
          additionalProperties:
            type: string
            pattern: '^[0-9]+$'

    Agent:
      type: object
      required:
        - id
        - name
        - description
        - tags
        - metadata
        - status
        - suspended
        - created_by
        - created_at
        - updated_at
        - upstream_url
        - credential_ref
        - invocation_rate_limit
        - invocation_burst
        - emit_receipts
        - capture_body
        - protocol
        - mcp_transport
        - mcp_protocol_version
        - pricing
      properties:
        id: { type: string, description: The `agt_<uuidv7>` resource ID. }
        name: { type: string }
        description: { type: string }
        tags:
          type: array
          items: { type: string }
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        status:
          type: string
          enum: [pending, active, inactive]
          description: Derived from `upstream_url` — `pending` when absent, `active` once set; `inactive` after a delete.
        suspended:
          type: boolean
          description: A suspended agent stays in the catalog but rejects invocations.
        created_by: { type: string, description: The subject claim of the user who created the agent. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        upstream_url: { type: string, format: uri, nullable: true }
        credential_ref: { type: string, nullable: true, description: The credential ID injected into upstream calls. }
        invocation_rate_limit: { type: number, nullable: true, description: Per-agent requests/second override (spec 0002). }
        invocation_burst: { type: integer, nullable: true, description: Token-bucket burst depth; defaults to 20 when only the rate is set. }
        emit_receipts: { type: boolean, description: Whether a Treeship trust receipt is emitted after each completed invocation. }
        capture_body: { type: boolean, description: Whether request/response bodies are captured on invocations (spec 0003). }
        protocol:
          type: string
          enum: [http, mcp]
        mcp_transport:
          type: string
          nullable: true
          enum: [streamable_http]
          description: Required and validated only when `protocol=mcp` (spec 0004).
        mcp_protocol_version: { type: string, nullable: true }
        pricing:
          allOf:
            - $ref: "#/components/schemas/Pricing"
          nullable: true

    AgentCreateRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        tags:
          type: array
          items: { type: string }
        metadata:
          type: object
          additionalProperties: true
        upstream_url:
          type: string
          format: uri
          nullable: true
          description: Must be http(s) with a host; loopback/private/link-local hosts and `localhost` are rejected (SSRF hygiene).
        credential_ref: { type: string, nullable: true }
        emit_receipts: { type: boolean, default: false }
        capture_body: { type: boolean, default: false }
        protocol:
          type: string
          enum: [http, mcp]
          default: http
        mcp_transport:
          type: string
          nullable: true
          enum: [streamable_http]
          description: Required when `protocol=mcp`; rejected when `protocol=http`.
        mcp_protocol_version: { type: string, nullable: true }
        pricing:
          allOf:
            - $ref: "#/components/schemas/Pricing"
          nullable: true

    AgentUpdateRequest:
      type: object
      description: >-
        Partial update (PATCH). Fields documented "tri-state" accept: an
        absent key (leave unchanged), an explicit `null` (clear the field), or
        a value (set it). Other fields are simple "absent leaves unchanged, a
        value sets it" toggles — they have no clear semantics.
      properties:
        name: { type: string, description: "Absent leaves unchanged. Must not be empty when present." }
        description: { type: string, description: Absent leaves unchanged. }
        tags:
          type: array
          items: { type: string }
          description: Absent leaves unchanged.
        metadata:
          type: object
          additionalProperties: true
          description: Absent leaves unchanged.
        upstream_url:
          type: string
          format: uri
          nullable: true
          description: Tri-state. Same SSRF hygiene as create. Setting/clearing this also re-derives `status`.
        credential_ref:
          type: string
          nullable: true
          description: Tri-state.
        suspended: { type: boolean, description: Absent leaves unchanged. }
        invocation_rate_limit:
          type: number
          nullable: true
          description: Tri-state. Must be greater than zero when set to a value.
        invocation_burst:
          type: integer
          nullable: true
          description: Tri-state. Must be at least 1 when set to a value.
        emit_receipts: { type: boolean, description: Absent leaves unchanged. }
        capture_body: { type: boolean, description: Absent leaves unchanged. }
        protocol:
          type: string
          enum: [http, mcp]
          description: Absent leaves unchanged. Validated against the resulting mcp_transport/pricing combination.
        mcp_transport:
          type: string
          nullable: true
          enum: [streamable_http]
          description: Tri-state.
        mcp_protocol_version:
          type: string
          nullable: true
          description: Tri-state.
        pricing:
          allOf:
            - $ref: "#/components/schemas/Pricing"
          nullable: true
          description: Tri-state — `null` unprices the agent.

    AgentListResponse:
      type: object
      required: [agents, page, per_page, total]
      properties:
        agents:
          type: array
          items: { $ref: "#/components/schemas/Agent" }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }

    CredentialCreateRequest:
      type: object
      required: [name, auth_type, source]
      properties:
        name: { type: string }
        auth_type:
          type: string
          enum: [bearer, api_key, none]
        source:
          type: string
          enum: [managed, vault]
        plaintext:
          type: string
          writeOnly: true
          description: Required when `source=managed`. Envelope-encrypted before persistence; never returned.
        vault_ref:
          type: string
          description: Required when `source=vault`. Opaque path in the external secrets store.

    CredentialPutRequest:
      type: object
      description: All fields optional; an absent key leaves it unchanged.
      properties:
        name: { type: string, description: Must not be empty when present. }
        auth_type:
          type: string
          enum: [bearer, api_key, none]
        plaintext:
          type: string
          writeOnly: true
          description: "source=managed only. Re-encrypts under the current KEK. Must not be empty when present."
        vault_ref:
          type: string
          description: "source=vault only."

    Credential:
      type: object
      required: [id, name, auth_type, source, version, created_at, updated_at]
      properties:
        id: { type: string, description: The `cred_<uuidv7>` resource ID. }
        name: { type: string }
        auth_type:
          type: string
          enum: [bearer, api_key, none]
        source:
          type: string
          enum: [managed, vault]
        masked_hint:
          type: string
          description: Present only for `source=managed` — a redacted hint of the secret, never the secret itself.
        vault_ref:
          type: string
          description: Present only for `source=vault`.
        version: { type: integer, description: Incremented on each rotation. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CredentialListResponse:
      type: object
      required: [credentials]
      properties:
        credentials:
          type: array
          items: { $ref: "#/components/schemas/Credential" }

    InvocationSettlement:
      type: object
      description: The settlement sub-record (spec 0006). Omitted entirely on unpriced/gate-only invocations.
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, settled, settlement_failed, settled_upstream_failed]
        tx_hash: { type: string }
        settled_amount: { type: string, description: Smallest-unit decimal string. }
        operator_amount: { type: string, description: "settled_amount minus facilitator_fee." }
        facilitator_fee: { type: string, description: Absent on a self-hosted facilitator that reports no fee. }
        attempts: { type: integer }
        reason: { type: string, description: Coarse failure reason; never raw facilitator response bytes. }
        settled_at: { type: string, format: date-time }

    InvocationListItem:
      type: object
      required:
        - id
        - agent_id
        - mode
        - status
        - error_class
        - model
        - mcp_method
        - mcp_tool
        - payment_network
        - payment_asset
        - payment_amount
        - payment_payer
        - payment_nonce
        - upstream_status
        - latency_ms
        - ttft_ms
        - req_size
        - resp_size
        - created_at
        - completed_at
      properties:
        id: { type: string, description: The `inv_<uuidv7>` resource ID. }
        agent_id: { type: string }
        mode:
          type: string
          enum: [transactional, streaming]
        status:
          type: string
          enum: [pending, running, succeeded, failed]
        error_class:
          type: string
          nullable: true
          enum: [timeout, upstream_5xx, upstream_4xx, ssrf_blocked, credential_error, cancelled, internal]
        model: { type: string, nullable: true }
        mcp_method: { type: string, nullable: true }
        mcp_tool: { type: string, nullable: true }
        payment_network: { type: string, nullable: true }
        payment_asset: { type: string, nullable: true }
        payment_amount: { type: string, nullable: true }
        payment_payer: { type: string, nullable: true }
        payment_nonce: { type: string, nullable: true }
        settlement:
          allOf:
            - $ref: "#/components/schemas/InvocationSettlement"
        upstream_status: { type: integer, nullable: true }
        latency_ms: { type: integer, nullable: true, format: int64 }
        ttft_ms: { type: integer, nullable: true, format: int64, description: Time to first byte; null unless the streaming path received at least one byte. }
        req_size: { type: integer, nullable: true, format: int64 }
        resp_size: { type: integer, nullable: true, format: int64 }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }

    InvocationListResponse:
      type: object
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/InvocationListItem" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }

    InvocationDetail:
      type: object
      description: Same shape as `InvocationListItem` plus body-capture fields.
      required:
        - id
        - agent_id
        - mode
        - status
        - error_class
        - model
        - mcp_method
        - mcp_tool
        - payment_network
        - payment_asset
        - payment_amount
        - payment_payer
        - payment_nonce
        - upstream_status
        - latency_ms
        - ttft_ms
        - req_size
        - resp_size
        - body_captured
        - created_at
        - completed_at
      properties:
        id: { type: string }
        agent_id: { type: string }
        mode:
          type: string
          enum: [transactional, streaming]
        status:
          type: string
          enum: [pending, running, succeeded, failed]
        error_class:
          type: string
          nullable: true
          enum: [timeout, upstream_5xx, upstream_4xx, ssrf_blocked, credential_error, cancelled, internal]
        model: { type: string, nullable: true }
        mcp_method: { type: string, nullable: true }
        mcp_tool: { type: string, nullable: true }
        payment_network: { type: string, nullable: true }
        payment_asset: { type: string, nullable: true }
        payment_amount: { type: string, nullable: true }
        payment_payer: { type: string, nullable: true }
        payment_nonce: { type: string, nullable: true }
        settlement:
          allOf:
            - $ref: "#/components/schemas/InvocationSettlement"
        upstream_status: { type: integer, nullable: true }
        latency_ms: { type: integer, nullable: true, format: int64 }
        ttft_ms: { type: integer, nullable: true, format: int64 }
        req_size: { type: integer, nullable: true, format: int64 }
        resp_size: { type: integer, nullable: true, format: int64 }
        body_captured:
          type: boolean
          description: Whether capture was on for this invocation, regardless of whether the caller's scope allows reading the bodies.
        req_body:
          type: string
          format: byte
          description: "Base64-encoded, capped at 1 MiB. Present only when body_captured and the caller holds the invocations:read_body scope."
        resp_body:
          type: string
          format: byte
          description: "Base64-encoded, capped at 1 MiB. Present only when body_captured and the caller holds the invocations:read_body scope."
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }

    InvocationAcceptedResponse:
      type: object
      required: [invocation_id]
      properties:
        invocation_id: { type: string }

    InvocationPollResponse:
      type: object
      required:
        - invocation_id
        - agent_id
        - status
        - created_at
        - updated_at
        - completed_at
        - upstream_status
        - latency_ms
        - mcp_method
        - mcp_tool
        - payment_network
        - payment_asset
        - payment_amount
        - payment_payer
        - payment_nonce
      properties:
        invocation_id: { type: string }
        agent_id: { type: string }
        status:
          type: string
          enum: [pending, running, succeeded, failed]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
        upstream_status: { type: integer, nullable: true }
        latency_ms: { type: integer, nullable: true, format: int64 }
        mcp_method: { type: string, nullable: true }
        mcp_tool: { type: string, nullable: true }
        payment_network: { type: string, nullable: true }
        payment_asset: { type: string, nullable: true }
        payment_amount: { type: string, nullable: true }
        payment_payer: { type: string, nullable: true }
        payment_nonce: { type: string, nullable: true }
        response_body_b64:
          type: string
          format: byte
          description: The captured upstream response body, base64-encoded. Present only when a response body was captured.

    Percentiles:
      type: object
      required: [p50, p95, p99]
      properties:
        p50: { type: integer, nullable: true, format: int64 }
        p95: { type: integer, nullable: true, format: int64 }
        p99: { type: integer, nullable: true, format: int64 }

    AnalyticsGroup:
      type: object
      required: [agent_id, bucket_start, count, error_rate, by_error_class, latency_ms, ttft_ms]
      properties:
        agent_id: { type: string }
        bucket_start: { type: string, format: date-time }
        count: { type: integer }
        error_rate: { type: number, description: "error_count / count, in [0,1]." }
        by_error_class:
          type: object
          additionalProperties: { type: integer }
        latency_ms: { $ref: "#/components/schemas/Percentiles" }
        ttft_ms: { $ref: "#/components/schemas/Percentiles" }

    AnalyticsResponse:
      type: object
      required: [range, bucket, groups]
      properties:
        range:
          type: object
          required: [since, until]
          properties:
            since: { type: string, format: date-time }
            until: { type: string, format: date-time }
        bucket:
          type: string
          enum: [hour, day]
        groups:
          type: array
          items: { $ref: "#/components/schemas/AnalyticsGroup" }

    SettlementConfigRequest:
      type: object
      description: Both fields optional; an absent field leaves the current value unchanged. The first configure call for a tenant must supply both.
      properties:
        facilitator_url:
          type: string
          format: uri
          description: Must be https with a host; loopback/private/link-local hosts and localhost are rejected.
        facilitator_credential_ref:
          type: string
          description: Must resolve to a credential owned by the same tenant.

    SettlementConfigResponse:
      type: object
      required: [facilitator_url, facilitator_credential_ref, created_at, updated_at]
      properties:
        facilitator_url: { type: string, format: uri }
        facilitator_credential_ref: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PolicyMatch:
      type: object
      description: >-
        Conditions a rule matches an in-flight call against (spec 0009). Every
        populated field must match for the rule to apply; an absent/empty
        field is not a match condition (matches any value). `tools` is
        meaningless for `protocol=http` agents (route-level only).
      properties:
        agents:
          type: array
          items: { type: string }
          description: Matches the calling agent's ID. Absent/empty matches any agent.
        tools:
          type: array
          items: { type: string }
          description: >-
            Matches the parsed MCP tool name, supporting a single trailing
            `*` wildcard (e.g. `read_*`). Absent/empty matches any tool.
        max_body_bytes:
          type: integer
          description: Matches when the request body size is at least this many bytes.
        rate_per_min:
          type: integer
          description: Matches when the caller's observed rate exceeds this many requests per minute.

    PolicyRule:
      type: object
      description: One ordered entry in a policy document's rule list, evaluated in order (spec 0009).
      required: [action, match]
      properties:
        action:
          type: string
          enum: [allow, warn, deny]
        match:
          $ref: "#/components/schemas/PolicyMatch"

    PolicyDocument:
      type: object
      description: >-
        The PUT /v1/policy request body: a wholesale replacement of the
        tenant's policy (spec 0009). `default` and `on_error` are both
        required on every call — there is no partial-patch "leave unchanged"
        state.
      required: [default, on_error, rules]
      properties:
        default:
          type: string
          enum: [allow, warn, deny]
          description: Applied when no rule matches. Operator-set, not hardcoded fail-closed.
        on_error:
          type: string
          enum: [allow, warn, deny]
          description: Applied when the evaluation engine or store errors.
        rules:
          type: array
          items:
            $ref: "#/components/schemas/PolicyRule"

    PolicyResponse:
      type: object
      description: The GET /v1/policy response — the full document, or its empty default when unconfigured.
      required: [version, rules]
      properties:
        version:
          type: integer
          description: 0 when the tenant has no policy configured.
        default:
          type: string
          enum: [allow, warn, deny]
        on_error:
          type: string
          enum: [allow, warn, deny]
        rules:
          type: array
          items:
            $ref: "#/components/schemas/PolicyRule"
        updated_at:
          type: string
          format: date-time
          description: Absent when the tenant has no policy configured.

    PutPolicyResponse:
      type: object
      description: The PUT /v1/policy response — version and timestamp only, not the full document just written.
      required: [version, updated_at]
      properties:
        version: { type: integer }
        updated_at: { type: string, format: date-time }

    PolicyDecision:
      type: object
      description: >-
        One recorded policy decision (spec 0009 audit capture). `reason` is the
        coarse, rule-position explanation — never call content (invariant #3).
      required: [id, agent_id, protocol, action, matched_rule, reason, created_at]
      properties:
        id:
          type: string
          description: The `pdec_<uuidv7>` decision ID (opaque).
        agent_id:
          type: string
          description: The agent the decision applied to.
        protocol:
          type: string
          description: The agent's protocol (e.g. `mcp`, `http`).
        mcp_tool:
          type: string
          nullable: true
          description: The parsed MCP tool the decision applied to; null for `protocol=http` calls.
        action:
          type: string
          enum: [allow, warn, deny]
        matched_rule:
          type: string
          description: The 1-based position of the rule that produced the action, or empty when it came from `default`/`on_error`.
        reason:
          type: string
          description: A coarse explanation of the action.
        created_at:
          type: string
          format: date-time

    PolicyDecisionsResponse:
      type: object
      description: The GET /v1/policy/decisions response — recent decisions, newest first.
      required: [data, limit]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PolicyDecision"
        limit:
          type: integer
          description: The effective limit applied to this response.

    X402Challenge:
      type: object
      description: The `402 Payment Required` challenge body for a priced route with no `X-PAYMENT` header (spec 0005).
      required: [x402Version, accepts]
      properties:
        x402Version: { type: integer }
        accepts:
          type: array
          items:
            $ref: "../x402types/openapi.yaml#/components/schemas/PaymentRequirements"
