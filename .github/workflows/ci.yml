# CI — the merge gate for the public Farcaster repo.
#
# Runs each Go module's own `make check` (tidy-check, fmt-check, vet, lint,
# race-tested tests) as an independent job. This mirrors exactly what
# contributors run locally with `make check`. No secrets are used.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [gateway, x402types, facilitator, sdk/go]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: '**/go.sum'

      - name: Install pinned dev tools (gofumpt, golangci-lint)
        run: make tools

      - name: make check
        run: make -C ${{ matrix.module }} check

  # The website (www/) is not a Go module, so it gets its own gate rather than a
  # matrix entry. It is path-aware and always-reporting: the job always runs (so
  # the required status context is never missing and can't deadlock a merge) but
  # short-circuits to a no-op when nothing it depends on changed.
  #
  # The path list deliberately includes the two OpenAPI schemas as well as www/
  # itself: the API reference renders from them at build time, so a schema change
  # on a branch that never touches www/ must still rebuild the site and fail
  # loudly if the reference no longer builds against it.
  check-www:
    name: check www
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether the site needs rebuilding
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA"...HEAD \
            | grep -qE '^(www/|gateway/openapi\.yaml$|x402types/openapi\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No www/ or OpenAPI changes — skipping the site build."
          fi

      - uses: actions/setup-node@v4
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: www/package-lock.json

      - name: make check
        if: steps.changed.outputs.run == 'true'
        run: make -C www check
